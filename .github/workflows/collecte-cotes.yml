name: Collecte des cotes

# Deux façons de se déclencher :
#  - automatiquement toutes les 6 heures (le collecteur) ;
#  - à la main (bouton « Run workflow »), pour vérifier la couverture, créer les
#    tables, ou lancer une collecte de test.
#
# ⚠️ Le déclenchement AUTOMATIQUE (schedule) ne fonctionne que depuis la branche
# par défaut du dépôt (main). Sur une autre branche, seul le bouton manuel marche.
on:
  schedule:
    - cron: '0 */6 * * *'      # collecteur + catalogue + surveillance + règlement, toutes les 6 h (UTC)
    - cron: '0 4 * * *'        # NOCTURNE, 1×/jour à 4 h UTC — APRÈS le collecteur de 00 h
    - cron: '0 7 * * *'        # RENDEZ-VOUS DU MATIN, 7 h UTC = 8 h locale (UTC+1)
  workflow_dispatch:
    inputs:
      action:
        description: "Quoi lancer"
        type: choice
        default: collecter
        options:
          - catalogue-competitions # liste TOUTES les compétitions foot + régime + coût (gratuit)
          - verifier-palier        # confirme le palier détecté (gratuit) — après (dés)abonnement
          - sonder-marches         # sonde double_chance/btts/1,5/3,5 sur un échantillon (crédits bornés)
          - verifier-couverture   # confirme les 11 ligues chez le fournisseur (gratuit)
          - synchro-catalogue     # (dés)active les compétitions selon le catalogue (gratuit)
          - migrer-base           # crée/complète les tables dans Supabase
          - backfill-historique   # charge 3 saisons football-data (une fois)
          - verifier-carte        # TEST 1 co-occurrence de la carte d'alias (lecture)
          - lister-equipes        # dump des équipes en base (lecture seule)
          - diag-fixtures         # que contient fixtures pour les matchs du ticket (lecture seule)
          - diag-teams            # doublons d'équipes pour les clubs du ticket (lecture seule)
          - diag-ecart            # matchs à venir COTÉS mais SANS probabilité, par régime (lecture seule)
          - diag-nocturne         # POURQUOI le modèle saute des matchs : nom diverge vs sans historique (lecture)
          - diag-trace            # remonte la chaîne du nocturne pour des matchs précis : fenêtre/index/expected_goals (lecture)
          - diag-books            # part des prédictions issues d'un exchange (Betfair…) vs bookmaker classique (lecture)
          - reconcilier-dryrun    # RAPPORT réconciliation club_id : intra-modèle + groupes + collisions (lecture)
          - reconcilier           # APPLIQUE club_id (écrit) : groupes − collisions, puis re-teste sur l'état final
          - redress-orientation-dryrun # LISTE les fixtures retournés + avant/après (lecture seule, rien écrit)
          - redress-orientation   # SOLDE les fixtures retournés (écrit) : ré-ancre sur le dernier relevé + efface les predictions périmées
          - dryrun-affixes        # SIMULE la neutralisation d'affixes : fusions + collisions (lecture seule)
          - compter-backfill      # compte les lignes fd: à supprimer (lecture seule)
          - reset-backfill        # purge fd: puis recharge (destructif, borné à fd:)
          - collecter             # relève les cotes une fois (fréquence graduée)
          - collecter-tout        # relève TOUTES les compétitions maintenant (validation à la demande)
          - nocturne              # calcule et remplit predictions + échantillon
          - echantillon           # relit predictions + état de source (lecture seule)
          - diag-totals           # diagnostic couverture plus/moins 2,5 (lecture fournisseur)
          - regler-scores         # sonde les scores des tickets en attente + déclenche le règlement/notifs (app)
          - backfill-reglement    # RATTRAPAGE unique : règle les vieux tickets terminés hors fenêtre 7 j (app, silencieux, idempotent)
          - notif-matin           # déclenche le rendez-vous du matin (app), à la demande

concurrency:
  group: collecte-cotes          # jamais deux collectes en même temps
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/model
    env:
      MTJ_PROVIDER: oddsapi
      MTJ_PROVIDER_KEY: ${{ secrets.MTJ_PROVIDER_KEY }}
      MTJ_DATABASE_URL: ${{ secrets.MTJ_DATABASE_URL }}
      # Déclenchement des jobs de notification côté app (règlement + matin).
      MTJ_APP_URL: ${{ secrets.MTJ_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # Alerte email avec le MOTIF en objet (health.py). Facultatif : si ces secrets
      # sont absents, la surveillance retombe sur l'email d'échec générique de GitHub.
      MTJ_ALERT_EMAIL_KEY: ${{ secrets.MTJ_ALERT_EMAIL_KEY }}
      MTJ_ALERT_EMAIL_TO: ${{ secrets.MTJ_ALERT_EMAIL_TO }}
      MTJ_ALERT_EMAIL_FROM: ${{ secrets.MTJ_ALERT_EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer le paquet et ses dépendances
        run: pip install -e .

      - name: Catalogue des compétitions football chez le fournisseur (gratuit, /sports)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'catalogue-competitions'
        run: python -m mtj_model.pipeline.catalogue

      - name: Vérifier le palier détecté (gratuit, /sports)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'verifier-palier'
        run: python -m mtj_model.pipeline.quota

      - name: Sonder les marchés additionnels sur un échantillon (crédits bornés)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'sonder-marches'
        run: python -m mtj_model.pipeline.probe_markets

      - name: Vérifier la couverture des 11 championnats
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'verifier-couverture'
        run: python -m mtj_model.pipeline.verify

      - name: Créer / compléter les tables (migrations)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'migrer-base'
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          # Retire tout espace/retour à la ligne parasite de la chaîne collée.
          DBURL="${MTJ_DATABASE_URL//[$'\t\r\n ']/}"
          for f in 0000_schema_idempotent 0005_predictions_pipeline 0006_league_catalog 0007_prediction_bookmaker 0008_source_mode 0009_regime_cote_seule 0010_team_club_id 0011_vision_stats; do
            echo "== migration $f =="
            psql "$DBURL" -v ON_ERROR_STOP=1 -f ../db/migrations/$f.sql
          done

      - name: Charger l'historique football-data (backfill)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'backfill-historique'
        env:
          MTJ_DATA_SOURCE: footballdata   # officiel prioritaire ; miroir en repli (par fichier)
        run: python -m mtj_model.pipeline.backfill

      - name: Vérifier la carte d'alias (TEST 1 co-occurrence)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'verifier-carte'
        env:
          MTJ_DATA_SOURCE: footballdata
        run: python -m mtj_model.pipeline.checkmap

      - name: Lister les équipes en base (lecture)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'lister-equipes'
        run: python -m mtj_model.pipeline.backfill --list-teams

      - name: Diagnostic fixtures — que contient la table pour les matchs du ticket (lecture)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'diag-fixtures'
        run: python -m mtj_model.pipeline.diag_fixtures

      - name: Dry-run neutralisation d'affixes — fusions + collisions (lecture)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'dryrun-affixes'
        run: python -m mtj_model.pipeline.neutralize_dryrun

      - name: Diagnostic équipes — doublons pour les clubs du ticket (lecture)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'diag-teams'
        run: python -m mtj_model.pipeline.diag_teams

      - name: Diagnostic écart collecte/nocturne — matchs cotés sans probabilité (lecture)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'diag-ecart'
        run: python -m mtj_model.pipeline.diag_pending

      - name: Diagnostic nocturne — pourquoi le modèle saute des matchs (lecture)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'diag-nocturne'
        run: python -m mtj_model.pipeline.diag_nightly

      - name: Trace nocturne — remonte la chaîne pour des matchs précis (lecture)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'diag-trace'
        run: python -m mtj_model.pipeline.diag_trace

      - name: Diagnostic books — part des prédictions issues d'un exchange (lecture)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'diag-books'
        run: python -m mtj_model.pipeline.diag_books

      - name: Rapport réconciliation club_id — dry-run, aucune écriture (lecture)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'reconcilier-dryrun'
        run: python -m mtj_model.pipeline.reconcile_dryrun

      - name: Appliquer la réconciliation club_id (écrit, re-teste l'état final)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'reconcilier'
        run: python -m mtj_model.pipeline.reconcile

      - name: Redressement orientation — dry-run, avant/après (lecture seule)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'redress-orientation-dryrun'
        run: python -m mtj_model.pipeline.redress_orientation

      - name: Redressement orientation — SOLDE le lot retourné (écrit)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'redress-orientation'
        run: python -m mtj_model.pipeline.redress_orientation --apply

      - name: Compter les lignes du backfill (lecture)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'compter-backfill'
        run: python -m mtj_model.pipeline.backfill --count

      - name: Purger le backfill et recharger (borné à fd:)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'reset-backfill'
        env:
          MTJ_DATA_SOURCE: footballdata
        run: python -m mtj_model.pipeline.backfill --reset

      - name: Synchroniser le catalogue (auto-activation, gratuit /sports)
        if: (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.action == 'synchro-catalogue')
        run: python -m mtj_model.pipeline.catalogue_sync

      - name: Collecter les cotes
        # UNIQUEMENT sur le cron 6 h : au cron 4 h (nocturne) on ne recollecte pas
        # (ce serait recollecter la fenêtre de 00 h, des crédits pour rien).
        if: (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.action == 'collecter')
        run: python -m mtj_model.pipeline.collector

      - name: Collecter TOUTES les compétitions (forcé, validation à la demande)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'collecter-tout'
        run: python -m mtj_model.pipeline.collector --all

      # ---- SUIVI DE RÉSULTAT (toutes les 6 h) ------------------------------
      # 1) Scores : on ne sonde QUE les ligues avec un ticket en attente (0 crédit
      #    les jours sans attente) ; le coût est journalisé À PART (« [settle-scores] »).
      - name: Rafraîchir les scores des tickets en attente (payant, ciblé)
        if: (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.action == 'regler-scores')
        run: python -m mtj_model.pipeline.settle_scores
      # 2) Règlement + notifications : l'app LIT la base (gratuit), règle et notifie.
      #    Secret partagé ; l'étape échoue bruyamment si l'URL/secret manque.
      - name: Déclencher le règlement + le suivi de résultat (app)
        if: (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.action == 'regler-scores')
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${MTJ_APP_URL%/}/api/cron/settle"

      # ---- BACKFILL DU RÈGLEMENT (rattrapage manuel, unique) --------------
      # Règle les tickets analysés non réglés dont les matchs sont terminés, SANS la
      # borne de 7 jours du job régulier (qui laisse les vieux tickets en attente à vie).
      # Silencieux (aucun push) et idempotent (resultat IS NULL) : relançable sans risque.
      # La réponse JSON (candidats/réglés/enAttente/sansRéglable) s'imprime dans le log.
      - name: Backfill du règlement (app, rattrapage unique)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'backfill-reglement'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${MTJ_APP_URL%/}/api/cron/settle-backfill"

      # ---- RENDEZ-VOUS DU MATIN (7 h UTC = 8 h locale) ---------------------
      - name: Rendez-vous du matin (app)
        if: (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') || (github.event_name == 'workflow_dispatch' && inputs.action == 'notif-matin')
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${MTJ_APP_URL%/}/api/cron/matin"

      - name: Pipeline nocturne (remplit predictions) + échantillon
        # Automatique au cron 4 h UTC, OU à la main. Un résumé lisible est écrit sur
        # la page du run (onglet Actions) : on confirme d'un coup d'œil, sans logs.
        if: (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *') || (github.event_name == 'workflow_dispatch' && inputs.action == 'nocturne')
        env:
          DECLENCHEUR: "${{ github.event_name }} ${{ github.event.schedule }}"
        run: |
          python -m mtj_model.pipeline.nightly | tee /tmp/nocturne.log
          echo "----- échantillon -----"
          python -m mtj_model.pipeline.nightly --sample 24
          {
            echo "### 🌙 Nocturne exécuté ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            echo ""
            echo "Déclencheur : **${DECLENCHEUR}**"
            echo ""
            echo '```'
            grep -E '^\[nightly\] commit|^Nocturne |^  couverture |^  crédits |repli COTE SEULE' /tmp/nocturne.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Échantillon predictions + état de source (lecture)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'echantillon'
        run: python -m mtj_model.pipeline.nightly --sample 24

      - name: Diagnostic couverture plus/moins 2,5 (lecture fournisseur)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'diag-totals'
        run: python -m mtj_model.pipeline.diag_totals

      - name: Surveillance (fraîcheur des jobs)
        if: github.event_name == 'schedule'
        run: python -m mtj_model.pipeline.health
