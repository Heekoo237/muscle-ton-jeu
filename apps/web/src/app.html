<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#F8F1E4" />
		<!-- CSS critique inline : le crème est posé avant tout, jamais de flash blanc (§13.4). -->
		<style>
			html {
				background: #f8f1e4;
			}
		</style>
		<!-- Indice d'auth AVANT le premier affichage (pages prérendues) : choisit le
		     bon bouton nav sans scintillement. Le cookie mtj_hint ne contient qu'un
		     « 1 » (un compte existe) — aucune identité, aucun jeton, aucun accès. -->
		<script>
			try {
				document.documentElement.dataset.auth = /(?:^|;\s*)mtj_hint=1(?:;|$)/.test(
					document.cookie
				)
					? 'yes'
					: 'no';
			} catch (e) {}
		</script>
		<link rel="preload" href="/fonts/anton-latin-fr.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/geist-variable-latin-fr.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
