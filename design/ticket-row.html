<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:12px;height:64px;padding:0 16px;box-sizing:border-box;border-bottom:1px solid #E2D6C0;background:{{ bg }};border-left:{{ leftRule }}">
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
    <div style="font-size:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:{{ inkMatch }};text-decoration:{{ strikeMatch }}">{{ match }}</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;color:{{ inkMarket }};text-decoration:{{ strike }}">
      <sc-if value="{{ isFragile }}" hint-placeholder-val="{{ false }}"><span style="flex:0 0 auto;line-height:1;font-size:13px">▲</span></sc-if>
      <span style="overflow:hidden;text-overflow:ellipsis">{{ market }}</span>
    </div>
  </div>
  <sc-if value="{{ showBadge }}" hint-placeholder-val="{{ false }}">
    <span style="flex:0 0 auto;display:inline-flex;align-items:center;height:28px;padding:0 12px;background:{{ badgeBg }};border:{{ badgeBorder }};border-radius:999px;font-size:14px;color:{{ badgeInk }}">retiré</span>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:64},&quot;idx&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;match&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Arsenal – Liverpool&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;market&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Arsenal ou match nul&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;odds&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1.42&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;solid&quot;,&quot;fragile&quot;,&quot;retire&quot;,&quot;removed&quot;],&quot;default&quot;:&quot;solid&quot;,&quot;tsType&quot;:&quot;'solid' | 'fragile' | 'retire' | 'removed'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state || 'solid';
    const fragile = state === 'fragile';
    const removed = state === 'removed';
    const retire = state === 'retire';
    return {
      showBadge: removed || retire,
      badgeBg: retire ? '#F8F1E4' : '#F8F1E4',
      badgeInk: retire ? '#8C6309' : '#6E6357',
      badgeBorder: retire ? '1px solid #D9BC72' : '1px solid #E2D6C0',
      idx: this.props.idx,
      match: this.props.match,
      market: this.props.market,
      odds: this.props.odds,
      isFragile: fragile,
      isRemoved: removed,
      showOdds: !removed && !retire,
      bg: (fragile || retire) ? '#F6E9CB' : (removed ? '#EFE5D3' : '#FFFFFF'),
      leftRule: (fragile || retire) ? '3px solid #8C6309' : '0px solid transparent',
      inkMatch: removed ? '#6E6357' : '#24201B',
      inkMarket: (fragile || retire) ? '#8C6309' : (removed ? '#6E6357' : '#4A4238'),
      strike: (removed || retire) ? 'line-through' : 'none',
      strikeMatch: removed ? 'line-through' : 'none'
    };
  }
}

</script>
</body>
</html>
